apply plugin: 'java'
apply plugin: 'kotlin'

version = "unspecified"

jar {
    manifest {
        attributes['Main-Class'] = 'com.majeur.inputmethod.tools.emoji.MakeEmojiKeys'
    }
    from("src/main/resources")
}

task makeEmoji(type: Exec, dependsOn: ['jar']) {
    commandLine 'java', '-jar', jar.archiveFile.get().asFile.absolutePath,
                '-assets', "${rootProject.project('app').projectDir.path}/src/main/assets/emoji"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
