name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build the Debug variant (which you've optimized to strip large dictionaries)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Path matches your exact configuration and versioning output rule
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Deskdrop-Debug-APK
          path: app/build/outputs/apk/debug/Deskdrop_1.3.1.apk